# Continuous integration for the CDP suite.
#
# On every push and pull request this builds all of the programs from source
# on Linux and macOS, runs a short smoke test (synthesis, a time-domain
# process, and a pvoc analysis/resynthesis round trip), and uploads the
# resulting binaries as downloadable artifacts.
#
# GitHub runs this automatically on its own machines — nothing to install or
# host. Each commit and PR gets a green tick or a red cross, so build breaks
# on either platform are caught the moment they land rather than at release
# time. Artifacts let anyone try the freshly built programs without a local
# toolchain.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:   # allows manual runs from the Actions tab

jobs:
  build:
    name: Build & smoke test (${{ matrix.os }}, ${{ matrix.cc }})
    strategy:
      # If one configuration fails, still finish the others so a single run
      # reports the full picture.
      fail-fast: false
      # Linux is built with both GCC and Clang (both preinstalled on the
      # runners), so compiler-specific breakage — like a flag only one of
      # them accepts — shows up here instead of on a user's machine.
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc,   cxx: g++     }
          - { os: ubuntu-latest, cc: clang, cxx: clang++ }
          - { os: macos-latest,  cc: clang, cxx: clang++ }
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v5

      # cmake and the compilers are preinstalled on all GitHub runners.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j 4

      # Not a test suite, but enough to prove the built programs run and
      # produce sound: synthesise 2 s of 440 Hz sine, transpose it down an
      # octave, then do a pvoc analysis/resynthesis round trip.
      - name: Smoke test
        run: |
          set -ex
          cd NewRelease
          ./synth wave 1 test.wav 44100 1 2.0 440
          ./modify speed 2 test.wav shifted.wav -12
          ./pvoc anal 1 test.wav test.ana
          ./pvoc synth test.ana resynth.wav
          ls -l test.wav shifted.wav resynth.wav
          rm -f test.wav shifted.wav test.ana resynth.wav

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: cdp-programs-${{ matrix.os }}-${{ matrix.cc }}
          path: NewRelease/
          retention-days: 14
